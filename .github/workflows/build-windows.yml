name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Validate repository hygiene
        run: npm run validate:repo

      - name: Install
        run: npm ci

      - name: Validate bundled Mihomo
        run: npm run validate:mihomo

      - name: Cache electron-builder tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json', 'electron-builder.yml', 'scripts/cache-electron-win.mjs', 'scripts/electron-distribution.mjs', 'scripts/electron-win-x64.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Test
        # Avoid a PowerShell 7 module path while retaining the runner's prewarmed PS5 analysis cache.
        # Spawn contracts and a lightweight real child prove production still scrubs both settings.
        shell: cmd
        run: |
          if not defined PSModuleAnalysisCachePath (
            echo ERROR: GitHub runner PS5 analysis cache is unavailable.
            exit /b 1
          )
          if /I "%PSModuleAnalysisCachePath%"=="NUL" (
            echo ERROR: GitHub runner PS5 analysis cache is disabled.
            exit /b 1
          )
          if not exist "%PSModuleAnalysisCachePath%" (
            echo ERROR: GitHub runner PS5 analysis cache file does not exist.
            exit /b 1
          )
          set "PSModulePath="
          node node_modules\vitest\vitest.mjs run --exclude tests/main/updateInstallerLauncher.test.ts --exclude tests/main/manageInstalledProcessScript.test.ts
          if errorlevel 1 exit /b 1
          node node_modules\vitest\vitest.mjs run tests/main/manageInstalledProcessScript.test.ts
          if errorlevel 1 exit /b 1
          node node_modules\vitest\vitest.mjs run tests/main/updateInstallerLauncher.test.ts
          if errorlevel 1 exit /b 1

      - name: Test Worker maintenance
        run: npm run test:worker

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Build Worker
        run: npm run build:worker

      - name: Typecheck
        run: npm run typecheck

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Lint
        run: npm run lint --if-present

      - name: Check formatting
        run: npm run format:check --if-present

      - name: Build update installers
        run: npm run dist:win:release

      - name: Smoke packaged output
        run: npm run smoke

      - name: Read package version
        id: package
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youyu-windows-x64-${{ steps.package.outputs.version }}
          path: |
            release/YouYu-${{ steps.package.outputs.version }}-x64.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64.exe.blockmap
            release/latest.yml
            release/YouYu-${{ steps.package.outputs.version }}-x64-in.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64-in.exe.blockmap
            release/latest-in.yml
            release/YouYu-${{ steps.package.outputs.version }}-x64-no.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64-no.exe.blockmap
            release/latest-no.yml
            release/YouYu-${{ steps.package.outputs.version }}-Mihomo-*-source.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-github-release.mjs --tag ${{ github.ref_name }} --dir release --publish
