name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - vc

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install
        run: npm ci

      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json', 'electron-builder.yml', 'scripts/cache-electron-win.mjs') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build update installers
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm run dist:win:release
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq $maxAttempts) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds (20 * $attempt)
          }

      - name: Smoke packaged output
        run: npm run smoke

      - name: Read package version
        id: package
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: youyu-windows-x64-${{ steps.package.outputs.version }}
          path: |
            release/YouYu-${{ steps.package.outputs.version }}-x64.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64.exe.blockmap
            release/latest.yml
            release/YouYu-${{ steps.package.outputs.version }}-x64-in.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64-in.exe.blockmap
            release/latest-in.yml
            release/YouYu-${{ steps.package.outputs.version }}-x64-no.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64-no.exe.blockmap
            release/latest-no.yml
          if-no-files-found: error
          retention-days: 3
