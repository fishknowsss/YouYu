name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - vc
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build update installers
        run: npm run dist:win:release

      - name: Smoke packaged output
        run: npm run smoke

      - name: Read package version
        id: package
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: youyu-windows-x64-${{ steps.package.outputs.version }}
          path: |
            release/YouYu-${{ steps.package.outputs.version }}-x64.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64.exe.blockmap
            release/latest.yml
            release/YouYu-${{ steps.package.outputs.version }}-x64-in.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64-in.exe.blockmap
            release/latest-in.yml
            release/YouYu-${{ steps.package.outputs.version }}-x64-no.exe
            release/YouYu-${{ steps.package.outputs.version }}-x64-no.exe.blockmap
            release/latest-no.yml
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "release/YouYu-$version-x64.exe",
            "release/YouYu-$version-x64.exe.blockmap",
            "release/latest.yml",
            "release/YouYu-$version-x64-in.exe",
            "release/YouYu-$version-x64-in.exe.blockmap",
            "release/latest-in.yml",
            "release/YouYu-$version-x64-no.exe",
            "release/YouYu-$version-x64-no.exe.blockmap",
            "release/latest-no.yml"
          )

          $releaseExists = $false
          try {
            gh release view $tag *> $null
            $releaseExists = $LASTEXITCODE -eq 0
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release edit $tag --title "YouYu $version" --notes "YouYu $version"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "YouYu $version" --notes "YouYu $version"
          }
