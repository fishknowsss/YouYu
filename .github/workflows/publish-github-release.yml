name: Publish GitHub Release

on:
  workflow_run:
    workflows: ['Build Windows']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag such as v1.7.10
        required: true
        type: string
      run_id:
        description: Successful Build Windows run that already produced the 11 public assets
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
      RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Publish public assets from Build Windows
        run: |
          notes="${RELEASE_NOTES:-YouYu ${RELEASE_TAG}}"
          node scripts/publish-github-release.mjs \
            --tag "${RELEASE_TAG}" \
            --from-run "${RELEASE_RUN_ID}" \
            --dir release \
            --publish \
            --notes "${notes}"

      - name: Verify published GitHub Release
        run: npm run release:verify:remote -- --version "${RELEASE_TAG#v}"
